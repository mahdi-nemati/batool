# Batool — local development infrastructure.
#
# Default (`docker compose up -d`) starts only PostgreSQL, which is what the
# Bun-driven dev workflow needs (apps run locally via `bun run dev`). Copy
# `.env.example` to `.env` first; deployment credentials and origins are
# intentionally required rather than silently defaulted.
#
# Optional full-stack mode (also containerises the API + web):
#   docker compose --profile app up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: batool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - batool-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: batool-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
    ports:
      - "4000:4000"
    command:
      [
        "sh",
        "-c",
        "bunx --bun prisma migrate deploy --schema /app/packages/database/prisma/schema.prisma && bun src/main.ts",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:4000/api/health').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: batool-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:?NEXT_PUBLIC_API_ORIGIN is required}
      API_SERVER_ORIGIN: ${API_SERVER_ORIGIN:?API_SERVER_ORIGIN is required}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  batool-postgres:
